---
name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
  pull_request: # for testing, when we change the workflow
    branches:
      - main
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: read

# No caches in this workflow: a poisoned cache must not reach the published package.
jobs:
  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js and Bun
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: node bun # versions from mise.toml
          cache: false

      - run: make package

  publish:
    name: Publish to npm
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/aws-cloudformation-custom-resource
    permissions:
      id-token: write # OIDC token for npm trusted publishing
      contents: read # checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js and Bun
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: node bun # versions from mise.toml
          cache: false

      - run: make publish
