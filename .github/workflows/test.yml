---
name: Test

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Only one run at a time may use the AWS test account.
  boarding-gate:
    permissions:
      actions: read
      contents: write # lock refs under refs/boarding-gate/
      pull-requests: read # labels for label-weights
      statuses: write # queue position as commit status
    # Queue order, the concurrency group that cancels outdated waiting runs and
    # the rebase of branches that are behind main: see
    # https://github.com/udondan/boarding-gate#reusable-workflow
    # The rebase needs OVERRIDE_TOKEN: pushes with github.token don't start new runs.
    uses: udondan/boarding-gate/.github/workflows/boarding-gate.yml@v1
    secrets:
      update-token: ${{ secrets.OVERRIDE_TOKEN }}

  # Decides whether the AWS test is needed. Only changes that can't affect the
  # deployment (docs, repo config, other workflows) skip it. Any other file,
  # including unknown ones, runs it. Pushes are compared with the previous
  # commit; workflow_dispatch always runs it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # compare commits
      pull-requests: read # list the files of the pull request
    outputs:
      aws: ${{ steps.check.outputs.aws }}
    steps:
      - name: Check changed files
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          elif [[ "$EVENT" == push && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            compare=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER")
            # The compare API lists at most 300 files.
            if [[ $(jq '.files | length' <<<"$compare") -ge 300 ]]; then
              echo "aws=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            files=$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<<"$compare")
          else
            echo "aws=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          aws=false
          while IFS= read -r file; do
            case "$file" in
              "") continue ;;
              .github/workflows/test.yml) aws=true ;;
              *.md | LICENSE | .gitignore | codecov.yml | renovate.json | release-please-config.json | .release-please-manifest.json | .qlty/* | .github/*) continue ;;
              *) aws=true ;;
            esac
            echo "Needs the AWS test: $file"
            break
          done <<<"$files"
          echo "aws=$aws" >>"$GITHUB_OUTPUT"

  test:
    name: Test
    needs: [boarding-gate, unit, changes]
    # A skipped job counts as passed for required checks. Run the job even if
    # boarding-gate failed and fail it in the first step. Skip it if the unit
    # tests failed (the required job still fails on the unit result) or if
    # nothing changed that can affect the deployment.
    if: ${{ !cancelled() && needs.unit.result == 'success' && needs.changes.outputs.aws == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for assuming the AWS role
      contents: read # checkout
    steps:
      - name: Check turn
        if: needs.boarding-gate.result != 'success'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js and Bun
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: node bun # versions from mise.toml


      - name: Install dependencies
        run: make install

      - name: Linting
        run: make eslint

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test package
        run: make test
        env:
          AWS_REGION: us-east-1

      - name: Test building package
        run: make package

  # Unit tests with coverage. The AWS test only runs if they pass.
  unit:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the test job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      id-token: write # Codecov upload via OIDC
    steps:
      - name: Check turn
        if: needs.boarding-gate.result != 'success'
        run: exit 1
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js and Bun
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: node bun # versions from mise.toml

      - name: Install dependencies
        run: make install-root

      # Fails below 100 % line, branch or function coverage.
      - name: Unit tests
        run: make unit-test

      # main uploads its coverage in the Coverage workflow. For forks the
      # action uploads without a token instead of OIDC.
      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: lcov.info

  # Codecov reports its result as the check runs codecov/project and
  # codecov/patch. This job waits for them, so a coverage drop fails the
  # required job. It passes with a warning if Codecov doesn't report in time.
  coverage:
    runs-on: ubuntu-latest
    needs: unit
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.unit.result == 'success' }}
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  actions:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the test job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check turn
        if: needs.boarding-gate.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  # Code smells (complexity, duplication, nesting) and qlty plugins. Git-aware:
  # only smells introduced by the PR compared to main fail the job.
  qlty:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the test job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result != 'success'
        run: exit 1
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install qlty
        uses: qltysh/qlty-action/install@357cd88be7c73c5dc45cf7cf8f99a46ec0b62b73 # v2.6.0

      - name: Lint via qlty plugins
        run: qlty check --all

      - name: Report code smells
        if: github.event_name != 'pull_request'
        run: qlty smells --all --no-snippets

      - name: Report new code smells
        if: github.event_name == 'pull_request'
        run: qlty smells --upstream origin/main --no-snippets

      - name: Fail on new code smells
        if: github.event_name == 'pull_request'
        run: |
          count=$(qlty smells --upstream origin/main --json --quiet 2>/dev/null | jq length)
          if [ "$count" -gt 0 ]; then
            echo "::error::qlty found $count new code smell(s) compared to main"
            exit 1
          fi

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs: [boarding-gate, changes, test, unit, coverage, actions, qlty]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
