---
name: Test

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Only one run at a time may use the AWS test account.
  wait-for-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write # lock refs under refs/wait-for-turn/
      pull-requests: read # labels for label-weights
    # A new commit on the branch cancels the waiting of the outdated run, so the
    # new run doesn't queue behind it. Once a run has the turn, this job is
    # done: test jobs that already run are never cancelled.
    concurrency:
      group: test-wait-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      # Queue order: manual PRs first, then Renovate updates, then the
      # release-please PR, which is updated after every merge to main anyway.
      # Fails right away if the branch is behind main. Branch protection
      # requires PRs to be up to date, so testing an outdated branch is wasted
      # time: it has to be updated and tested again.
      - name: Wait for turn
        uses: udondan/wait-for-turn@bd3964aff95ce510ed9df3bfb4210306c62622dc # v1.5.0
        with:
          require-up-to-date: true
          label-weights: |
            autorelease: pending=-10
            renovate=-5

  test:
    name: Test
    needs: wait-for-turn
    # A skipped job counts as passed for required checks. Run the job even if
    # wait-for-turn failed and fail it in the first step.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for assuming the AWS role
      contents: read # checkout
    steps:
      - name: Check turn
        if: needs.wait-for-turn.result != 'success'
        run: exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules
        with:
          path: .npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: |
          make install
          (cd test && make install)

      - name: Linting
        run: make eslint

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test package
        run: make test
        env:
          AWS_REGION: us-east-1

      - name: Test building package
        run: make package

  # Doesn't wait for the AWS test account.
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs: [wait-for-turn, test, actions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
