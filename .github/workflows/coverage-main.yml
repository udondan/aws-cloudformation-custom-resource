---
name: Coverage

# Codecov compares the coverage of a pull request against main, so main needs
# a report as well. This workflow runs the unit tests on every push to main
# and uploads their coverage.

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install dependencies
        run: make install

      - name: Unit tests
        run: make unit-test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: lcov.info
